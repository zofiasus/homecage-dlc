[project]
name = "homecage-dlc"
version = "0.1.0"
description = "DeepLabCut pose tracking of group-housed mice from Actual Analytics HCA home-cage recordings"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "h5py",
    "imageio-ffmpeg",   # bundles an ffmpeg binary, so no system ffmpeg needed
    "numpy",
    "opencv-python-headless",
]

[project.optional-dependencies]
dlc = [
    "deeplabcut[gui]>=3.0.0rc1",
]

[tool.uv]
package = false
